name: wf-cd-production

on:
  push:
    branches:
      - develop

jobs:
  upload-artifact-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build site with Parcel
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./"

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "build-artifact-production"

  deploy-artifact-production:
    needs: upload-artifact-production
    runs-on: ubuntu-latest
    environment:
      name: production-env
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "build-artifact-production"
          token: "${{ github.token }}"
