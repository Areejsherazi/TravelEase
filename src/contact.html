<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="styles/contact.css">
</head>
<body>

  <h1>Contact Us</h1>

  <!-- Contact Form -->
  <form id="contactForm">
    <label>Name: <input type="text" id="name" required></label><br>
    <label>Email: <input type="email" id="email" required></label><br>
    <label>Message:<br><textarea id="message" required></textarea></label><br>
    <button type="submit">Send</button>
  </form>

  <!-- Office Contact Details -->
  <section>
    <h2>Office Contact</h2>
    <p>Phone: +1 234 567 890</p>
    <p>Email: office@example.com</p>
    <p>Address: 123 Web Street, HTML City, 00001</p>
  </section>

  <!-- Social Links -->
  <section>
    <h2>Follow Us</h2>
    <a href="https://facebook.com">Facebook</a> |
    <a href="https://twitter.com">Twitter</a> |
    <a href="https://instagram.com">Instagram</a>
  </section>

  <!-- Static Map Image -->
  <section>
    <h2>Our Location</h2>
    <img src="https://via.placeholder.com/600x300?text=Map+Image" alt="Map to our office">
  </section>

  <script src="scripts/contact.js"></script>

</body>
</html>
